<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<style>
  .option input { display: none; }         

  .option span {
    display: block;
    padding: 10px 16px;
    margin: 8px 0;
    border: 2px solid transparent;          
    border-radius: 8px;
    cursor: pointer;
  }

  .option input:checked + span {
    border-color: #4a90e2;                 
  }
</style>
</head>
<body>
  <label class="option">
    <input type="radio" name="choice" value="1">
    <span>Варіант 1</span>
  </label>
  <label class="option">
    <input type="radio" name="choice" value="2">
    <span>Варіант 2</span>
  </label>
  <label class="option">
    <input type="radio" name="choice" value="3">
    <span>Варіант 3</span>
  </label>
</body>
</html>
